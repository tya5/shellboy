# Copy to your chosen user config path, then replace the URL and model IDs.
# Keys are read from environment variables; do not paste credentials here.
default_connection = "proxy"
default_model = "REPLACE_WITH_MODEL_ID"

[connections.proxy]
# api = "responses" # Or "chat_completions" (stateless history, no reasoning-item replay)
# or "anthropic_messages" (native Anthropic API; see max_tokens).
# max_tokens = 32768 # anthropic_messages only.
base_url = "https://proxy.example/v1"
api_key_env = "SHELLBOY_API_KEY"
# Optional: send the raw environment value in this header instead of Bearer auth.
# api_key_header = "x-api-key" # Or Azure's "api-key"; valid for every api dialect.
# Set false only to disable certificate verification for this connection.
# ssl_verify = true
# Conversation/summary Responses headers identify each Thread automatically.
# session_header = true
# Optional Responses body key; enable only when supported by your provider.
# prompt_cache_key = false
# Opt-in Responses comparison with the Thread's last adopted response ID.
# prompt_cache_diagnostics = false
# Role for Shellboy-inserted context; use "user" behind gateways that reject a
# conversation not ending with a user message (e.g. LiteLLM in front of Claude).
# context_role = "developer"
# Provider-specific options Shellboy sends without interpreting them.
# extra_body = { temperature = 0.2 }
# extra_headers = { "X-Beta-Feature" = "alpha" }
# Positive Responses header wait, including request upload.
# response_header_timeout_ms = 120000
# Maximum receive inactivity after headers; 0 disables only this body limit.
# Active streams have no total-duration limit.
# stream_idle_timeout_ms = 600000
# Total timeout for non-streaming requests (models, embeddings); minimum 1000.
# request_timeout_ms = 60000
# Consecutive transient retries; successful adopted responses reset this budget.
# response_max_retries = 8
# Exponential backoff cap; Retry-After uses a separate fixed 10-minute cap.
# response_retry_max_delay_ms = 60000
# Retry interrupted partial streams; false keeps partial failures for manual recovery.
# response_retry_partial = true
# From the second eligible consecutive failure, maximally reduce safe context.
# auto_trim_on_disconnect = true
# No input-size threshold or pre-POST reduction; all resends share the retry budget.
# default_effort = "YOUR_PROVIDER_SUPPORTED_VALUE"

# Embeddings are optional. Enabling them indexes newly finalized conversation
# text; old conversation backfill still requires an explicit selection.
# [embedding]
# connection = "proxy"
# model = "REPLACE_WITH_EMBEDDING_MODEL_ID"
# Optional synchronous request aggregation; select caps supported by your proxy.
# batch_max_inputs = 1 # 1..128; default keeps singleton requests
# batch_max_chars = 64000 # 1..1048576 Unicode characters; covers split_chars if batching

[retention]
tool_raw_days = 7
tool_raw_bytes = 1073741824
clipboard_days = 7
clipboard_bytes = 268435456

[ui]
# UI language: "en" (default) or "ja"; restart the TUI after changing it.
language = "en"
# Maximum owned-work rows above the composer, from 1 to 10 (default 3).
live_work_rows = 3
# Fixed held-input rows (1..10); folds are remembered only for this UI process.
held_input_rows = 3
# program_status = "on" # OSC7501 terminal status; "off" emits nothing.
# motion = "on" # "off" keeps the spinner, heading blink and status shimmer static.
# Header/user surfaces: dark or light; NO_COLOR uses plain markers instead.
palette = "dark"
# Notify once when a new recovery wait needs attention (terminal bell).
bell = true
# Extra repaint on overlay close and history scroll. Restart after changing.
# Enable if residue remains after closing help or scrolling; disable if slower.
clean_redraw = false

# Stop automatic conversation embeddings without disabling standalone RAG.
# Explicit index backfill/rebuild/probe can still incur API cost.
[indexing]
auto_history = true
# Which kinds of conversation content automatic indexing takes in (restart to change):
#   user, summary, assistant_response, tool_result, spill, event
# The default keeps the index small: your messages and summaries. Tool output is
# most of the volume; add "tool_result" or "assistant_response" to index them too,
# or pick Threads with `shellboy index backfill --kind tool_result --thread ID`.
auto_kinds = ["user", "summary"]

# Explicit compact --summary limits; either key may be used alone in this section.
# The smaller limit wins, with an effective floor of 2000 Unicode characters.
# [compaction]
# summary_max_chars = 20000
# summary_max_percent = 5
# summary_map_max_requests = 128 # 1..4096; cached parts do not consume requests
# summary_reduce_max_requests = 16 # 1..4096

[shell]
# Model-authored tool-row labels; false removes the parameter from generation tools.
describe_calls = true
# Unknown model-supplied shell parameters: warn or strict.
unknown_arguments = "warn"
