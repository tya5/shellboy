# Copy to your chosen user config path, then replace the URL and model IDs.
# Keys are read from environment variables; do not paste credentials here.
default_connection = "proxy"
default_model = "REPLACE_WITH_MODEL_ID"

[connections.proxy]
base_url = "https://proxy.example/v1"
api_key_env = "SHELLBOY_API_KEY"
# Set false only to disable certificate verification for this connection.
# ssl_verify = true
# Conversation/summary Responses headers identify each Thread automatically.
# session_header = true
# Optional Responses body key; enable only when supported by your provider.
# prompt_cache_key = false
# Maximum inactivity while waiting for stream headers or the next received chunk.
# 0 disables this limit; active streams have no total-duration limit.
# stream_idle_timeout_ms = 600000
# Total timeout for non-streaming requests (models, embeddings); minimum 1000.
# request_timeout_ms = 60000
# Consecutive transient retries; successful adopted responses reset this budget.
# response_max_retries = 8
# Exponential backoff cap; Retry-After uses a separate fixed 10-minute cap.
# response_retry_max_delay_ms = 60000
# Retry interrupted partial streams; false keeps partial failures for manual recovery.
# response_retry_partial = true
# default_effort = "YOUR_PROVIDER_SUPPORTED_VALUE"

# Embeddings are optional. Enabling them indexes newly finalized conversation
# text; old conversation backfill still requires an explicit selection.
# [embedding]
# connection = "proxy"
# model = "REPLACE_WITH_EMBEDDING_MODEL_ID"

[retention]
tool_raw_days = 7
tool_raw_bytes = 1073741824
clipboard_days = 7
clipboard_bytes = 268435456

[ui]
# Notify once when a new recovery wait needs attention (terminal bell).
bell = true
