name: ConPTY send reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conpty:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-v1
      - name: Install ConPTY driver
        run: python -m pip install pywinpty==2.0.15 pyte==0.8.2
      - name: Build
        run: cargo build --locked --bin shellboy
      - name: Observe synthetic ConPTY sends via PowerShell and Git Bash
        run: python scripts/dev/conpty-send-repro.py --binary target/debug/shellboy.exe
