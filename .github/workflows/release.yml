name: Release binaries
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-smoke:
    name: Public v0.4.0 ${{ matrix.os }} ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            shell: sh
          - os: macos-15
            shell: sh
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Anonymous public downloads, native smoke and temporary installation
        shell: bash
        env:
          INSTALLER_SHELL: ${{ matrix.shell }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/check-v040-public.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-v040-${{ matrix.os }}-${{ matrix.shell }}
          path: public-v040-result.json
