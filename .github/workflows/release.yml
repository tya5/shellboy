name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable package label (existing tag for publication, or candidate version)
        required: true
        type: string

      installer_checks:
        description: Test installers against public v0.3.0 assets only (no build or publication)
        required: false
        default: false
        type: boolean

      candidate_ref:
        description: Exact main SHA for validation only (no tag or GitHub Release is created)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.candidate_ref || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.installer_checks }}
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: shellboy.exe
            archive: zip
          - os: macos-15
            target: aarch64-apple-darwin
            executable: shellboy
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: shellboy
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_EXECUTABLE: ${{ matrix.executable }}
      RELEASE_ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-v1
          cache-on-failure: true
      - name: Check tag version and native build host
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          metadata = json.loads(subprocess.check_output(['cargo', '+1.99.1', 'metadata', '--locked', '--no-deps', '--format-version', '1'], text=True))
          version = next(package['version'] for package in metadata['packages'] if package['name'] == 'shellboy')
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Use a stable vX.Y.Z version tag'
          assert tag == f'v{version}', 'Tag must match the Cargo package version'
          candidate = os.environ.get('CANDIDATE_REF', '')
          if candidate:
              assert re.fullmatch(r'[0-9a-f]{40}', candidate), 'Candidate must be an exact SHA'
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == candidate
          rustc = subprocess.check_output(['rustc', '+1.99.1', '-vV'], text=True)
          assert f"host: {os.environ['RELEASE_TARGET']}" in rustc, rustc
          PY
      - name: Build locked release binary
        run: |
          if [[ "$RELEASE_TARGET" == "aarch64-apple-darwin" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          git rev-parse HEAD
          cargo +1.99.1 build --locked --release --bin shellboy --target "$RELEASE_TARGET"
      - name: Smoke-test the native executable
        run: |
          "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --version
          "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --help
      - name: Package binary and public documentation
        run: |
          python - <<'PY'
          import os, shutil, tarfile, zipfile
          from pathlib import Path
          name = f"shellboy-{os.environ['RELEASE_TAG']}-{os.environ['RELEASE_TARGET']}"
          stage = Path('package') / name
          stage.mkdir(parents=True)
          executable = os.environ['RELEASE_EXECUTABLE']
          shutil.copy2(Path('target') / os.environ['RELEASE_TARGET'] / 'release' / executable, stage / executable)
          for filename in ('LICENSE', 'README.md', 'config.example.toml'):
              shutil.copy2(filename, stage / filename)
          # Guides are embedded in the binary; also make the Markdown usable offline.
          shutil.copytree('docs', stage / 'docs')
          out = Path('dist')
          out.mkdir()
          archive = out / f"{name}.{os.environ['RELEASE_ARCHIVE']}"
          if os.environ['RELEASE_ARCHIVE'] == 'zip':
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for path in sorted(stage.rglob('*')):
                      if path.is_file():
                          bundle.write(path, path.relative_to(stage.parent))
          else:
              with tarfile.open(archive, 'w:gz') as bundle:
                  bundle.add(stage, arcname=name)
          print(archive)
          PY
      - name: Extract and smoke-test the packaged native executable
        run: |
          python - <<'PY'
          import hashlib, os, subprocess, tarfile, tempfile, zipfile
          from pathlib import Path
          archive, = Path('dist').iterdir()
          root = Path(tempfile.mkdtemp(prefix='shellboy-packaged-'))
          if archive.suffix == '.zip':
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(root)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(root, filter='data')
          stage, = root.iterdir()
          binary = stage / os.environ['RELEASE_EXECUTABLE']
          version = subprocess.check_output([str(binary), '--version'], text=True).strip()
          assert version == 'shellboy ' + os.environ['RELEASE_TAG'][1:], version
          subprocess.run([str(binary), '--help'], check=True, stdout=subprocess.DEVNULL)
          subprocess.run([str(binary), 'docs', 'list'], check=True, stdout=subprocess.DEVNULL)
          assert all((stage / name).is_file() for name in ['LICENSE', 'README.md', 'config.example.toml'])
          assert (stage / 'docs/guides/user-guide.md').is_file()
          print('packaged native smoke:', version, os.environ['RELEASE_TARGET'])
          print('binary_sha256:', hashlib.sha256(binary.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    name: Assemble validated archives, installers and SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check complete asset set and write SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          expected = {
              f'shellboy-{tag}-x86_64-pc-windows-msvc.zip',
              f'shellboy-{tag}-aarch64-apple-darwin.tar.gz',
              f'shellboy-{tag}-x86_64-unknown-linux-gnu.tar.gz',
          }
          # Bind each installer to the archives from this exact release.
          for name in ('install.sh', 'install.ps1'):
              source = Path(name).read_text(encoding='utf-8')
              assert source.count('__SHELLBOY_RELEASE_VERSION__') == 1
              Path('dist', name).write_text(source.replace('__SHELLBOY_RELEASE_VERSION__', tag), encoding='utf-8')
              expected.add(name)
          files = sorted(Path('dist').iterdir())
          assert {path.name for path in files} == expected, 'Incomplete or unexpected release assets'
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files]
          Path('dist/SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish release and checksums
    if: ${{ !inputs.installer_checks && !inputs.candidate_ref }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-assets
          path: dist
      - name: Upload all assets before publishing
        shell: bash
        run: |
          set -euo pipefail
          # A failed upload leaves a draft, which a rerun may safely resume.
          # Published releases are immutable here; never silently replace their binaries.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release is already published"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Shellboy $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  installer-unix:
    if: ${{ inputs.installer_checks }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public downloads, replacement, and failure paths
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile
          source = pathlib.Path('install.sh').read_text()
          with tempfile.TemporaryDirectory(prefix='shellboy-installer-') as root:
              root = pathlib.Path(root)
              dest = root / 'install dir'
              env = dict(os.environ, SHELLBOY_INSTALL_DIR=str(dest), SHELLBOY_VERSION='0.3.0')
              # Input through stdin exercises the `curl ... | sh` execution form.
              def run(script=source, ok=True, environment=env):
                  result = subprocess.run(['sh'], input=script, text=True, env=environment, capture_output=True)
                  print(result.stdout, result.stderr)
                  assert (result.returncode == 0) == ok, result.returncode
                  return result.stdout + result.stderr
              out = run(source.replace('__SHELLBOY_RELEASE_VERSION__', 'v99.0.0'))
              assert 'PATH' in out and 'restart' in out and 'back up' in out
              binary = dest / 'shellboy'
              assert subprocess.check_output([str(binary), '--version'], text=True).strip() == 'shellboy 0.3.0'
              original = binary.read_bytes()
              # A release-bound script works without an environment override.
              pinned_env = env.copy()
              pinned_env.pop('SHELLBOY_VERSION')
              run(source.replace('__SHELLBOY_RELEASE_VERSION__', 'v0.3.0'), environment=pinned_env)
              backups = list(dest.glob('shellboy.backup-*'))
              assert len(backups) == 1 and backups[0].read_bytes() == original
              mocks = root / 'mocks'
              mocks.mkdir()
              curl = mocks / 'curl'
              curl.write_text('''#!/bin/sh
          while [ "$#" -gt 0 ]; do
              case "$1" in -o) shift; out=$1 ;; https:*) url=$1 ;; esac
              shift
          done
          case "$url" in
              */SHA256SUMS) printf '%064d  shellboy-v0.3.0-%s.tar.gz\\n' 0 "$TEST_TARGET" > "$out" ;;
              *) printf 'corrupt archive' > "$out" ;;
          esac
          ''')
              curl.chmod(0o755)
              target = 'aarch64-apple-darwin' if os.uname().sysname == 'Darwin' else 'x86_64-unknown-linux-gnu'
              bad_env = dict(env, PATH=str(mocks) + os.pathsep + env['PATH'], TEST_TARGET=target)
              assert 'SHA-256 mismatch' in run(ok=False, environment=bad_env)
              assert binary.read_bytes() == original and len(list(dest.glob('shellboy.backup-*'))) == 1
              empty = root / 'must not exist'
              bad_env['SHELLBOY_INSTALL_DIR'] = str(empty)
              run(ok=False, environment=bad_env)
              assert not empty.exists()
              uname = mocks / 'uname'
              uname.write_text('#!/bin/sh\ncase "$1" in -s) echo Linux ;; *) echo aarch64 ;; esac\n')
              uname.chmod(0o755)
              assert 'Unsupported OS/CPU' in run(ok=False, environment=bad_env)
              assert not empty.exists()
          PY

  installer-windows:
    if: ${{ inputs.installer_checks }}
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public downloads, replacement, and failure paths
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
          $env:SHELLBOY_INSTALL_DIR = Join-Path $root 'install dir'
          $env:SHELLBOY_VERSION = '0.3.0'
          $source = Get-Content install.ps1 -Raw
          $held = $null
          function Start-HeldBinary([string]$path) {
              # Keep the real executable mapped without an owner, provider or DB:
              # message send waits for stdin EOF before connecting to an owner.
              $info = New-Object Diagnostics.ProcessStartInfo
              $info.FileName = $path
              $info.Arguments = 'message send --text-stdin'
              $info.UseShellExecute = $false
              $info.RedirectStandardInput = $true
              $process = [Diagnostics.Process]::Start($info)
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw 'Image-lock fixture exited early' }
              return $process
          }
          try {
              # iex uses the same execution form as `irm ... | iex`.
              $output = $source.Replace('__SHELLBOY_RELEASE_VERSION__', 'v99.0.0') | Invoke-Expression | Out-String
              Write-Output $output
              if ($output -notmatch 'PATH' -or $output -notmatch 'restart' -or $output -notmatch 'back up') { throw 'Missing guidance' }
              $binary = Join-Path $env:SHELLBOY_INSTALL_DIR 'shellboy.exe'
              if ((& $binary --version) -ne 'shellboy 0.3.0') { throw 'Wrong version' }
              $hash = (Get-FileHash $binary).Hash
              $held = Start-HeldBinary $binary
              Remove-Item Env:SHELLBOY_VERSION
              $source.Replace('__SHELLBOY_RELEASE_VERSION__', 'v0.3.0') | Invoke-Expression
              $backups = @(Get-ChildItem "$binary.backup-*")
              if ($backups.Count -ne 1 -or (Get-FileHash $backups[0].FullName).Hash -ne $hash) { throw 'Missing backup' }
              if ($held.HasExited) { throw 'Replacement stopped the running executable' }
              if ((& $binary --version) -ne 'shellboy 0.3.0') { throw 'Replacement binary unusable' }
              $held.Kill()
              $held.WaitForExit()
              $held.Dispose()
              $held = Start-HeldBinary $binary
              $env:SHELLBOY_VERSION = 'v0.3.0'
              # Remove the staged file after copying it to force the final rename
              # to fail after the existing (running) image has moved to backup.
              function Copy-Item {
                  param([string]$LiteralPath, [string]$Destination)
                  Microsoft.PowerShell.Management\Copy-Item -LiteralPath $LiteralPath -Destination $Destination
                  Remove-Item -LiteralPath $Destination
              }
              $rolledBack = $false
              try { $source | Invoke-Expression } catch {
                  Write-Output "Expected install failure: $_"
                  $rolledBack = $true
              }
              Remove-Item Function:Copy-Item
              if (-not $rolledBack -or $held.HasExited) { throw 'Rollback fixture failed' }
              if ((Get-FileHash $binary).Hash -ne $hash -or @(Get-ChildItem "$binary.backup-*").Count -ne 1) { throw 'Rollback did not restore original binary' }
              if ((& $binary --version) -ne 'shellboy 0.3.0') { throw 'Restored binary unusable' }
              $held.Kill()
              $held.WaitForExit()
              $held.Dispose()
              $held = $null
              function Invoke-WebRequest {
                  param([switch]$UseBasicParsing, [string]$Uri, [string]$OutFile)
                  if ($Uri.EndsWith('/SHA256SUMS')) {
                      ('0' * 64) + '  shellboy-v0.3.0-x86_64-pc-windows-msvc.zip' | Set-Content $OutFile
                  } else { 'corrupt archive' | Set-Content $OutFile }
              }
              function Assert-Failure([string]$message) {
                  $failed = $false
                  try { $source | Invoke-Expression } catch {
                      Write-Output $_
                      if ($_ -notmatch $message) { throw }
                      $failed = $true
                  }
                  if (-not $failed) { throw 'Installer unexpectedly succeeded' }
              }
              Assert-Failure 'SHA-256 mismatch'
              if ((Get-FileHash $binary).Hash -ne $hash -or @(Get-ChildItem "$binary.backup-*").Count -ne 1) { throw 'Existing installation changed on failure' }
              $env:SHELLBOY_INSTALL_DIR = Join-Path $root 'must not exist'
              Assert-Failure 'SHA-256 mismatch'
              if (Test-Path $env:SHELLBOY_INSTALL_DIR) { throw 'Failure created destination' }
              $env:PROCESSOR_ARCHITEW6432 = 'ARM64'
              Assert-Failure 'Unsupported OS/CPU'
          } finally {
              if ($held) {
                  if (-not $held.HasExited) { $held.Kill(); $held.WaitForExit() }
                  $held.Dispose()
              }
              if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          }
