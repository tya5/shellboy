name: Sandbox capability probe (branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Probe bubblewrap write and network namespaces
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          uname -a
          bwrap --version
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir "$root/work" "$root/tmp"
          # This is a capability smoke, not the complete owner/proxy recipe.
          bwrap --unshare-user --unshare-net --ro-bind / / \
            --bind "$root/work" "$root/work" --bind "$root/tmp" "$root/tmp" \
            /bin/sh -c '
              set -eu
              printf allowed > "$1/work/allowed"
              printf temporary > "$1/tmp/allowed"
              if printf forbidden > "$1/outside"; then exit 1; fi
              python3 -c "import socket; s=socket.socket(); s.settimeout(1); assert s.connect_ex((\"1.1.1.1\",443)) != 0"
            ' sh "$root"
          test -f "$root/work/allowed"
          test ! -e "$root/outside"
          echo 'PASS: writable work/temp, read-only root, no direct network'
