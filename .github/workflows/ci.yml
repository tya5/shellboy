name: Rust checks
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Repeat native overflow, proxy and attachment observations
        type: boolean
        default: false
      performance:
        description: Compare baseline/current Windows timings and four-thread contention
        type: boolean
        default: false
      native_tui_performance:
        description: Also record native Unix P2 (600s) and P5 (60s), before/after at 80/140 columns
        type: boolean
        default: false
      native_tui_baseline_ref:
        description: Exact baseline ref for same-runner native TUI observations
        type: string
        default: '1fec7f0b2000b7dadbcec518e493cdfec169eeee'
      native_tui_candidate_ref:
        description: Candidate ref (empty uses this workflow commit)
        type: string
        default: ''
      windows_test_threads:
        description: Windows threads (4 selects Windows-only experiment; default/2 check all OSes)
        type: choice
        options: ['default', '2', '4']
        default: 'default'
      baseline_ref:
        description: Baseline commit for the optional Windows comparison
        type: string
        default: '0469ca03fe97191b91d10cb0ba78ac5d612bb97f'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_test_threads == '4' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-v1
          cache-on-failure: true
      - name: Check complete integration layout
        run: python scripts/check-test-layout.py
      - name: Check timing runner failure gates
        run: python -m unittest discover -s scripts/tests
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --keep-going -- -D warnings
      - name: Diagnose native Windows overflow recovery
        if: runner.os == 'Windows' && inputs.diagnostics == true
        run: cargo test --locked --test integration runtime_features::both_overflow_retries_preserve_call_groups_and_never_execute_saved_tools_twice -- --exact --nocapture
      - name: Select measured Windows fixture concurrency
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SELECTED_TEST_THREADS: ${{ inputs.windows_test_threads == '2' && '2' || '4' }}
        run: '"RUST_TEST_THREADS=$env:SELECTED_TEST_THREADS" >> $env:GITHUB_ENV'
      - name: Tests
        run: python scripts/test-timings.py --output .local/ci-timings
      - name: Observe closed-proxy retry phases and timings
        if: inputs.diagnostics == true
        run: cargo test --locked --test integration response_upload_recovery::refused_proxy_connections_keep_retrying_beyond_two_and_recover_when_it_listens -- --exact --nocapture
      - name: Repeat attachment preparation observations in fresh processes
        if: inputs.diagnostics == true
        shell: bash
        run: |
          set -euo pipefail
          for observation in 1 2; do
            echo "Attachment preparation observation ${observation}/2"
            cargo test --locked --test integration attachment_provenance:: -- --nocapture
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-timings-${{ runner.os }}
          path: .local/ci-timings
          include-hidden-files: true
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.performance == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: before
            threads: '2'
          - sample: after
            threads: '2'
          - sample: after-four-threads
            threads: '4'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: ${{ matrix.sample == 'before' && inputs.baseline_ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject -> target
          shared-key: native-v1
          cache-on-failure: true
      - name: Record all-target and isolated test timings
        working-directory: subject
        shell: bash
        run: |
          profile=()
          if [[ "${{ matrix.sample }}" != after-four-threads ]]; then
            profile=(--per-test storage,index,control_db)
          fi
          python ../tooling/scripts/test-timings.py --output "$RUNNER_TEMP/test-performance-${{ matrix.sample }}" "${profile[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-performance-${{ matrix.sample }}
          path: ${{ runner.temp }}/test-performance-${{ matrix.sample }}

  native-tui-measure:
    if: github.event_name == 'workflow_dispatch' && inputs.native_tui_performance == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cols: [80, 140]
    runs-on: ${{ matrix.os }}
    # Two serial subjects, each 600s + 60s, plus two independent release builds.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: before
          ref: ${{ inputs.native_tui_baseline_ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: after
          ref: ${{ inputs.native_tui_candidate_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate harness failure and witness gates
        run: python -m unittest discover -s tooling/scripts/tests -p test_tui_measure.py
      - name: Record unavailable native Windows fixture
        if: runner.os == 'Windows'
        run: python tooling/scripts/tui-measure.py unavailable --baseline before --candidate after --output observations
      - name: Install CI-only fixed-screen decoder
        if: runner.os != 'Windows'
        run: python3 -m pip install --disable-pip-version-check -r tooling/scripts/measurement/requirements.txt
      - name: Install measured toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Instrument baseline temporary checkout
        if: runner.os != 'Windows'
        run: python3 tooling/scripts/tui-measure.py prepare --subject before --output observations/before
      - name: Instrument candidate temporary checkout
        if: runner.os != 'Windows'
        run: python3 tooling/scripts/tui-measure.py prepare --subject after --output observations/after
      - name: Build baseline measurement-only binary
        if: runner.os != 'Windows'
        run: python3 tooling/scripts/tui-measure.py build --subject before --output observations/before
      - name: Build candidate measurement-only binary
        if: runner.os != 'Windows'
        run: python3 tooling/scripts/tui-measure.py build --subject after --output observations/after
      - name: Record both subjects on this runner (no performance threshold gates)
        if: runner.os != 'Windows'
        run: python3 tooling/scripts/tui-measure.py run-pair --baseline before --candidate after --output observations --cols ${{ matrix.cols }}
      - name: Summarize available and missing observations
        if: always()
        run: python tooling/scripts/tui-measure.py summarize --output observations
      - name: Upload measurements, source patches and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tui-${{ runner.os }}-${{ matrix.cols }}-${{ github.run_id }}
          path: observations/
          if-no-files-found: error
          retention-days: 14
