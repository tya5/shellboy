# Validation branch only; never merge this workflow/tooling into main.
name: Rust checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    name: Windows split (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2']
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: '4'
    defaults:
      run:
        working-directory: subject
    steps:
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: 0ce31c1fa29e5a74203c73d163ab0479455b07f3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Verify exact product source and record separate tooling provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0ce31c1fa29e5a74203c73d163ab0479455b07f3
          echo "Product source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation tooling: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject -> target
          shared-key: native-v1
          cache-on-failure: true
      - name: Check product integration layout and fixture failure gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-test-layout.py
          python -m unittest discover -s scripts/tests
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --keep-going -- -D warnings
      - name: Execute original split ownership with four test threads
        run: python ../tooling/scripts/test-timings.py --windows-shard ${{ matrix.shard }} --output .local/ci-timings
      - name: Check freshly built bundled guides without owner or API
        run: python scripts/check-docs.py --binary target/debug/shellboy.exe --out .local/ci-timings/bundled-docs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-split-${{ matrix.shard }}
          path: subject/.local/ci-timings
          include-hidden-files: true
  inventory:
    name: Windows split inventory audit
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-split-*
          path: .local/audit
      - name: Require exact disjoint full inventory and ignored-set coverage
        run: >-
          python scripts/check-windows-shards.py
          .local/audit/windows-split-1/results.json
          .local/audit/windows-split-2/results.json
