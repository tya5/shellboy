# Validation-only branch: never merge this workflow into main.
name: Public v0.3.0 archive smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
            executable: shellboy.exe
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
            executable: shellboy
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            executable: shellboy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download anonymous public bytes, verify and run native binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        run: |
          python - <<'PY'
          import hashlib, os, platform, subprocess, tarfile, tempfile, zipfile
          from pathlib import Path
          base = 'https://github.com/tya5/shellboy/releases/download/v0.3.0/'
          expected = {
              'shellboy-v0.3.0-aarch64-apple-darwin.tar.gz': '1e0010db3a34cd6c159e591d92ffac64062ce793f767972f0518346522d8f5d4',
              'shellboy-v0.3.0-x86_64-pc-windows-msvc.zip': 'f708987b51106c347d9039cd8012daa5e26284f4f266c836131ac5c9f2c93046',
              'shellboy-v0.3.0-x86_64-unknown-linux-gnu.tar.gz': 'd3ff9508b2b835f446b9d7285c9ff78f2eeb8fab292a04430ae4c8f04c0754d9',
          }
          sums_hash = 'c8a139f704027220fd51bc173e54aa0e2fbb67fd35e0f9b4eb3859714b447611'
          name = f"shellboy-v0.3.0-{os.environ['RELEASE_TARGET']}.{os.environ['RELEASE_EXTENSION']}"
          root = Path(tempfile.mkdtemp(prefix='shellboy-public-v030-'))
          for filename, digest in [('SHA256SUMS', sums_hash), (name, expected[name])]:
              path = root / filename
              subprocess.run(['curl', '--disable', '--fail', '--location', '--silent', '--show-error',
                              '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2',
                              base + filename, '--output', str(path)], check=True)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (filename, actual, digest)
              print('public_sha256:', actual, filename, flush=True)
          manifest = {}
          for line in (root / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              digest, filename = line.split()
              assert filename not in manifest, 'Duplicate checksum entry'
              manifest[filename] = digest
          assert manifest == expected, manifest
          archive = root / name
          extracted = root / 'extracted'
          extracted.mkdir()
          if name.endswith('.zip'):
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(extracted)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(extracted, filter='data')
          stage, = extracted.iterdir()
          binary = stage / os.environ['RELEASE_EXECUTABLE']
          version = subprocess.check_output([str(binary), '--version'], text=True).strip()
          assert version == 'shellboy 0.3.0', version
          print('native_public_smoke:', platform.platform(), platform.machine(), name, version, flush=True)
          print('public_binary_sha256:', hashlib.sha256(binary.read_bytes()).hexdigest(), flush=True)
          PY
