name: Rust checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-v1
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --keep-going -- -D warnings
      - name: Diagnose native Windows overflow recovery
        if: runner.os == 'Windows'
        run: cargo test --locked --test runtime_features both_overflow_retries_preserve_call_groups_and_never_execute_saved_tools_twice -- --exact --nocapture
      - name: Bound concurrent Windows database fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUST_TEST_THREADS=2" >> $env:GITHUB_ENV'
      - name: Tests
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Observe closed-proxy retry phases and timings
        run: cargo test --locked --test response_upload_recovery refused_proxy_connections_keep_retrying_beyond_two_and_recover_when_it_listens -- --exact --nocapture
      - name: Repeat attachment preparation observations in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          for observation in 1 2; do
            echo "Attachment preparation observation ${observation}/2"
            cargo test --locked --test attachment_provenance -- --nocapture
          done
