name: Rust checks
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      source_prepare:
        description: Non-release source formatting, compile and focused artifacts
        type: boolean
        default: false
      shutdown_repeats:
        description: Run only the shutdown PTY test 50 times on native macOS, before and after
        type: boolean
        default: false
      shutdown_baseline:
        description: Exact baseline SHA for the focused shutdown comparison
        type: string
        default: '62a4c4def58dcf4a66327d37c343670f1bf3d68a'
      shell_output_repeats:
        description: Repeat the two shell-output regressions 30 times on three baselines and the candidate
        type: boolean
        default: false
      shell_output_repeat_count:
        description: Iterations per test and source (1..100)
        type: number
        default: 30
      conpty_repro:
        description: Observe synthetic Windows ConPTY send behavior
        type: boolean
        default: false
      diagnostics:
        description: Repeat native overflow, proxy and attachment observations
        type: boolean
        default: false
      footprint:
        description: Record cost-free Linux PSS and PTY startup of Shellboy and other agents on a fake model (no thresholds)
        type: boolean
        default: false
      performance:
        description: Compare baseline/current Windows timings and four-thread contention
        type: boolean
        default: false
      windows_test_threads:
        description: Windows threads; 4 runs Windows-only, 2 selects all OSes
        type: choice
        options: ['default', '2', '4']
        default: 'default'
      all_oses:
        description: Run all three OS checks on a task branch (main, land/*, integration/* always select all three)
        type: boolean
        default: false
      baseline_ref:
        description: Baseline commit for the optional Windows comparison
        type: string
        default: '0469ca03fe97191b91d10cb0ba78ac5d612bb97f'
permissions:
  contents: read
  actions: read
jobs:
  source-prepare:
    if: inputs.source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare source
        run: |
          set -euo pipefail
          mkdir -p source-artifacts
          git rev-parse HEAD > source-artifacts/source-sha.txt
          git rev-parse HEAD^{tree} > source-artifacts/source-tree.txt
          printf '%s\n' "$GITHUB_RUN_ID" > source-artifacts/run-id.txt
          run_recorded() {
            local name="$1"; shift
            local result=0
            "$@" || result=$?
            printf '%s\t%s\n' "$name" "$result" >> source-artifacts/command-status.tsv
            return "$result"
          }
          run_recorded format cargo fmt --all
          git diff --binary > source-artifacts/format.patch
          run_recorded check cargo check --tests 2>&1 | tee source-artifacts/check.log
          run_recorded single-request cargo test --lib compaction::single_request:: 2>&1 | tee source-artifacts/single-request.log
          run_recorded a-state cargo test --lib compaction::a_state:: 2>&1 | tee source-artifacts/a-state.log
          run_recorded build cargo build --bin shellboy
          run_recorded schema target/debug/shellboy protocol schema > source-artifacts/protocol.schema.json
      - name: Bind non-release source evidence
        if: always()
        run: |
          python3 - <<'PYART'
          import hashlib,json,pathlib
          p=pathlib.Path('source-artifacts')
          result={'kind':'non-release-working-tree-preparation','source_sha':(p/'source-sha.txt').read_text().strip(),'source_tree':(p/'source-tree.txt').read_text().strip(),'run_id':(p/'run-id.txt').read_text().strip(),'files':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}}
          statuses=dict(line.split('\t') for line in (p/'command-status.tsv').read_text().splitlines()) if (p/'command-status.tsv').exists() else {}
          result['command_exit_status']={k:int(v) for k,v in statuses.items()}
          expected={'format','check','single-request','a-state','build','schema'}
          result['qualification']='preparation-only' if set(statuses)==expected and all(v=='0' for v in statuses.values()) else 'failed-or-incomplete-reference-only'
          (p/'manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          PYART
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-artifacts
          path: source-artifacts/
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      docs_only: ${{ steps.evidence.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find successful exact-SHA native checks
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const reuse = require('./scripts/ci-reuse.cjs');
            await reuse({github, context, core});
  docs-checks:
    # #245: documentation-only main pushes skip the three-OS cargo checks.
    needs: reuse
    if: needs.reuse.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check language classification consistency
        run: python3 scripts/dev/language-audit.py --classifications scripts/dev/language-classifications.json --summary
      - name: Check documents read by Python tests
        run: |
          set -e
          # The test list lives next to embeddedDocPrefixes in scripts/ci-reuse.cjs.
          for t in $(node -p "require('./scripts/ci-reuse.cjs').docTestFiles.join(' ')"); do
            python3 -m unittest discover -s scripts/tests -p "$t"
          done
  check:
    needs: reuse
    if: always() && !inputs.source_prepare && !inputs.shutdown_repeats && !inputs.shell_output_repeats && needs.reuse.outputs.reuse != 'true' && needs.reuse.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Preserve the Windows-only experiment and two-thread all-OS diagnostic.
        # Ordinary task branches use Linux by default; landing branches always use all OSes.
        os: ${{ fromJSON(inputs.windows_test_threads == '4' && '["windows-latest"]' || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/land/') || startsWith(github.ref, 'refs/heads/integration/') || inputs.all_oses || inputs.windows_test_threads == '2') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-v1
          cache-on-failure: true
      - name: Reduce Windows scan and temp-volume overhead
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ephemeral runner only: skip real-time scanning of freshly built test
          # executables and fixtures, and keep fixture databases on the work volume.
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Write-Host "Defender exclusions: $($paths -join ', ')"
          } catch {
            Write-Warning "Defender exclusions were not applied: $_"
          }
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Check language classification consistency
        run: python scripts/dev/language-audit.py --classifications scripts/dev/language-classifications.json --summary
      - name: Synthetic Windows ConPTY send observation
        if: runner.os == 'Windows' && inputs.conpty_repro == true
        shell: pwsh
        run: |
          python -m pip install pywinpty==2.0.15 pyte==0.8.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --bin shellboy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev/conpty-send-repro.py --binary target/debug/shellboy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check complete integration layout
        run: python scripts/check-test-layout.py
      - name: Check timing runner failure gates
        run: python -m unittest discover -s scripts/tests
      - name: Check exact-SHA reuse failure gates
        if: runner.os == 'Linux'
        run: node --test scripts/tests/ci-reuse.test.cjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --keep-going -- -D warnings
      - name: Diagnose native Windows overflow recovery
        if: runner.os == 'Windows' && inputs.diagnostics == true
        run: cargo test --locked --test integration runtime_features::both_overflow_retries_preserve_call_groups_and_never_execute_saved_tools_twice -- --exact --nocapture
      - name: Select measured Windows fixture concurrency
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SELECTED_TEST_THREADS: ${{ inputs.windows_test_threads == '2' && '2' || '4' }}
        run: '"RUST_TEST_THREADS=$env:SELECTED_TEST_THREADS" >> $env:GITHUB_ENV'
      - name: Tests
        run: python scripts/test-timings.py --output .local/ci-timings
      - name: Verify integration DB observation build
        run: cargo test --locked --features test-db-observation --test integration db_observation_feature::integration_worker_samples_fast_statements -- --exact
      - name: Verify real CLI against fallback Unix namespace
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked --bin shellboy
          SHELLBOY_TEST_CLI_BINARY="$PWD/target/debug/shellboy" cargo test --locked --lib ipc::server::endpoint::tests::denied_temporary_bases_use_data_directory_and_cli_locator -- --exact
      - name: Observe closed-proxy retry phases and timings
        if: inputs.diagnostics == true
        run: cargo test --locked --test integration response_upload_recovery::refused_proxy_connections_keep_retrying_beyond_two_and_recover_when_it_listens -- --exact --nocapture
      - name: Repeat attachment preparation observations in fresh processes
        if: inputs.diagnostics == true
        shell: bash
        run: |
          set -euo pipefail
          for observation in 1 2; do
            echo "Attachment preparation observation ${observation}/2"
            cargo test --locked --test integration attachment_provenance:: -- --nocapture
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-timings-${{ runner.os }}
          path: .local/ci-timings
          include-hidden-files: true
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.performance == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: before
            threads: '2'
          - sample: after
            threads: '2'
          - sample: after-four-threads
            threads: '4'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: ${{ matrix.sample == 'before' && inputs.baseline_ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject -> target
          shared-key: native-v1
          cache-on-failure: true
      - name: Record all-target and isolated test timings
        working-directory: subject
        shell: bash
        run: |
          profile=()
          if [[ "${{ matrix.sample }}" != after-four-threads ]]; then
            profile=(--per-test storage,index,control_db)
          fi
          python ../tooling/scripts/test-timings.py --output "$RUNNER_TEMP/test-performance-${{ matrix.sample }}" "${profile[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-performance-${{ matrix.sample }}
          path: ${{ runner.temp }}/test-performance-${{ matrix.sample }}
  footprint:
    if: github.event_name == 'workflow_dispatch' && inputs.footprint == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: footprint-release-v1
      - name: Build the measured release binary
        run: cargo build --locked --release --bin shellboy
      - name: Record observations (no memory or time thresholds)
        run: python3 scripts/bench/footprint.py --binary target/release/shellboy --out .local/footprint/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shellboy-footprint-linux-${{ github.sha }}
          path: .local/footprint
          include-hidden-files: true
          if-no-files-found: warn
  compare:
    # #116 stage 2: same fake model, same workload, one runner for every agent.
    if: github.event_name == 'workflow_dispatch' && inputs.footprint == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: footprint-release-v1
      - name: Build the measured release binary
        run: cargo build --locked --release --bin shellboy
      - name: Install pinned agents (no login, no credentials)
        run: python3 scripts/bench/install_agents.py "$RUNNER_TEMP/agents"
      - name: Record observations (no memory or time thresholds)
        run: |
          mapfile -t agents < "$RUNNER_TEMP/agents/agents.args"
          python3 scripts/bench/compare.py --agent shellboy=target/release/shellboy "${agents[@]}" \
            --provenance "$RUNNER_TEMP/agents/provenance.json" --out .local/compare/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-comparison-linux-${{ github.sha }}
          path: .local/compare
          include-hidden-files: true
          if-no-files-found: warn

  shutdown-repeats:
    if: inputs.shutdown_repeats == true
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.shutdown_baseline }}
          path: baseline
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            baseline -> ../shared-target
            current -> ../shared-target
          shared-key: shutdown-repeat-v1
          cache-on-failure: true
      - name: Repeat unchanged baseline 50 times
        id: baseline
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target
        run: python3 current/scripts/dev/repeat-shutdown-test.py --source baseline --output evidence/before --count 50
      - name: Repeat current tip 50 times
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target
        run: python3 current/scripts/dev/repeat-shutdown-test.py --source current --output evidence/after --count 50
      - name: Require a complete exact-source comparison
        env:
          BASELINE_SHA: ${{ inputs.shutdown_baseline }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for phase, sha in [('before', os.environ['BASELINE_SHA']), ('after', os.environ['GITHUB_SHA'])]:
              result = json.loads(Path(f'evidence/{phase}/results.json').read_text())
              assert result['sha'] == sha, result
              assert len(result['results']) == result['count'] == 50, result
              assert not result.get('build_exit'), result
              if phase == 'after':
                  assert result['failures'] == 0, result
              print(phase, result['sha'], result['failures'], '/', result['count'])
          PY
      - name: Retain both exact-source results and PTY failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-repeats-macOS
          path: evidence


  shell-output-repeats:
    if: inputs.shell_output_repeats == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 44acf9555bdc4d3b5c5c6f4bf82ed398c9aa34b3
          path: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6a0827def47946948c4475365caeeefa1c2058b1
          path: v0.8.0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6f486695a4000c17a6ca209388902513b530289a
          path: pre-instrumentation
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            main -> ../shared-target/main
            v0.8.0 -> ../shared-target/v0.8.0
            pre-instrumentation -> ../shared-target/pre-instrumentation
            current -> ../shared-target/candidate
          shared-key: shell-output-repeat-v1
          cache-on-failure: true
      - name: Repeat both regressions on main
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target/main
        run: python3 current/scripts/dev/repeat-shell-output-tests.py --source main --output evidence/main --count ${{ inputs.shell_output_repeat_count }}
      - name: Repeat both regressions on v0.8.0
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target/v0.8.0
        run: python3 current/scripts/dev/repeat-shell-output-tests.py --source v0.8.0 --output evidence/v0.8.0 --count ${{ inputs.shell_output_repeat_count }}
      - name: Repeat both regressions before #201 instrumentation
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target/pre-instrumentation
        run: python3 current/scripts/dev/repeat-shell-output-tests.py --source pre-instrumentation --output evidence/pre-instrumentation --count ${{ inputs.shell_output_repeat_count }}
      - name: Repeat both regressions on candidate
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target/candidate
        run: python3 current/scripts/dev/repeat-shell-output-tests.py --source current --output evidence/candidate --count ${{ inputs.shell_output_repeat_count }}
      - name: Require complete exact-source evidence
        env:
          REPEAT_COUNT: ${{ inputs.shell_output_repeat_count }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for name, sha in [('main', '44acf9555bdc4d3b5c5c6f4bf82ed398c9aa34b3'),
                            ('v0.8.0', '6a0827def47946948c4475365caeeefa1c2058b1'),
                            ('pre-instrumentation', '6f486695a4000c17a6ca209388902513b530289a'),
                            ('candidate', os.environ['GITHUB_SHA'])]:
              result = json.loads(Path(f'evidence/{name}/results.json').read_text())
              assert result['sha'] == sha, result
              assert result['count'] == int(os.environ['REPEAT_COUNT']), result
              assert not result.get('build_exit'), result
              assert all(len(items) == result['count'] for items in result['results'].values()), result
              if name == 'candidate':
                  assert not any(result['failures'].values()), result
              print(name, sha, result['failures'])
          PY
      - name: Retain exact-source logs and per-iteration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-shell-output-repeats
          path: evidence
